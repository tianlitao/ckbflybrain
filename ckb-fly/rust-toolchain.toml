# The contract's code hash is part of its on-chain identity: the state cell's type script
# references the code by data hash, so a different compiler produces a different organism
# at a different address. Pinning the toolchain is therefore a correctness requirement, not
# a convenience. `make checksum` records the resulting hashes.
[toolchain]
channel = "1.98.1"
# `wasm32-unknown-unknown`, which `crates/flywasm` needs, is deliberately *not* listed here.
# Adding it would be harmless — this list only controls which `std` builds rustup keeps
# installed, and `flywasm` is not a dependency of any contract — but "harmless" is a claim
# about the one file that pins the contracts' code hashes. This project settles claims like
# that with a full clean cross-rebuild, not with reasoning, and that rebuild is not worth
# blocking every `cargo` invocation on a slow download for. `make wasm` names the one command
# to run instead, and says so when the target is missing.
targets = ["riscv64imac-unknown-none-elf"]
components = ["clippy", "rustfmt"]
profile = "minimal"
